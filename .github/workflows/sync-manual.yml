# GitHub 仓库同步配置
.github-sync: &github-sync
  docker:
    image: alpine/git:latest
  stages:
    - name: 配置 Git 环境
      script: |
        # 安装必要工具
        apk add --no-cache bash
        
        # 设置 Git 用户信息
        git config --global user.email "cnb@local.com"
        git config --global user.name "CNB Bot"
        
        # 配置 GitHub 凭证
        git config --global url."https://${GITHUB_TOKEN}:@github.com/".insteadOf "https://github.com/"
        
        echo "Git 环境配置完成"
    
    - name: 克隆并同步 GitHub 仓库
      script: |
        set -e  # 遇到错误立即退出
        
        echo "========================================"
        echo "开始同步任务"
        echo "执行时间: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "========================================"
        
        # 创建工作目录
        WORK_DIR="/tmp/github-sync-$(date +%s)"
        mkdir -p $WORK_DIR
        cd $WORK_DIR
        
        echo "步骤 1/4: 克隆 GitHub 仓库"
        echo "源仓库: https://github.com/tianli1680/kulaoTV.git"
        git clone --depth=1 https://github.com/tianli1680/kulaoTV.git .
        
        if [ ! -d ".git" ]; then
          echo "错误: GitHub 仓库克隆失败"
          exit 1
        fi
        
        echo "✓ 克隆成功"
        echo "文件数量: $(find . -type f -not -path './.git/*' | wc -l)"
        
        echo ""
        echo "步骤 2/4: 配置 CNB 远程仓库"
        CNB_REPO_URL="https://cnb:4nHxx367eG2LITgILI8xl6NuZEB@cnb.cool/tianli1680/ces.git"
        
        # 检查是否已存在 cnb 远程仓库
        if git remote | grep -q "^cnb$"; then
          git remote remove cnb
        fi
        git remote add cnb $CNB_REPO_URL
        
        echo "✓ CNB 仓库配置完成"
        
        echo ""
        echo "步骤 3/4: 准备推送到 CNB 仓库"
        echo "目标仓库: https://cnb.cool/tianli1680/ces"
        
        # 查看当前分支
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        echo "当前分支: $CURRENT_BRANCH"
        
        # 确保有提交记录
        if [ -z "$(git log -1 2>/dev/null)" ]; then
          echo "创建初始提交"
          git commit --allow-empty -m "Initial sync from GitHub"
        fi
        
        # 尝试拉取 CNB 仓库内容（如果存在）
        echo "尝试拉取 CNB 仓库现有内容..."
        git fetch cnb || true
        
        # 检查 CNB 仓库是否有内容
        if git ls-remote --heads cnb main | grep -q "refs/heads/main"; then
          echo "CNB 仓库已有 main 分支，进行合并..."
          git merge cnb/main --allow-unrelated-histories -m "Merge from CNB" || true
        else
          echo "CNB 仓库为空，将创建 main 分支"
        fi
        
        echo ""
        echo "步骤 4/4: 推送到 CNB 仓库"
        # 强制推送到 main 分支
        git push cnb HEAD:main --force
        
        if [ $? -eq 0 ]; then
          echo ""
          echo "========================================"
          echo "✓ 同步成功完成！"
          echo "同步时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "GitHub 仓库: tianli1680/kulaoTV"
          echo "CNB 仓库: tianli1680/ces"
          echo "推送分支: main"
          echo "========================================"
          
          # 显示同步的文件列表（前20个）
          echo ""
          echo "同步的文件列表（前20个）:"
          find . -type f -not -path './.git/*' | head -20 | sed 's/^./  /'
        else
          echo "错误: 推送到 CNB 仓库失败"
          exit 1
        fi

# 手动触发配置（增强版）
.manual-sync: &manual-sync
  docker:
    image: alpine/git:latest
  stages:
    - name: 手动同步 GitHub 仓库
      script: |
        set -e
        
        apk add --no-cache bash tree
        
        echo "========================================"
        echo "手动触发同步任务"
        echo "触发时间: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "========================================"
        
        # 配置 Git
        git config --global user.email "cnb@local.com"
        git config --global user.name "CNB Bot"
        git config --global url."https://${GITHUB_TOKEN}:@github.com/".insteadOf "https://github.com/"
        
        # 创建工作目录
        WORK_DIR="/tmp/manual-sync-$(date +%s)"
        mkdir -p $WORK_DIR
        cd $WORK_DIR
        
        echo "步骤 1/3: 克隆 GitHub 仓库"
        git clone https://github.com/tianli1680/kulaoTV.git .
        
        if [ ! -d ".git" ]; then
          echo "错误: GitHub 仓库克隆失败"
          exit 1
        fi
        
        echo "✓ GitHub 仓库克隆成功"
        echo "仓库内容:"
        ls -la | head -20
        
        echo ""
        echo "步骤 2/3: 配置并推送到 CNB 仓库"
        CNB_REPO_URL="https://cnb:4nHxx367eG2LITgILI8xl6NuZEB@cnb.cool/tianli1680/ces.git"
        
        git remote add cnb $CNB_REPO_URL
        
        # 推送所有内容到 CNB
        echo "正在推送到 CNB 仓库..."
        git push cnb HEAD:main --force
        
        if [ $? -eq 0 ]; then
          echo ""
          echo "步骤 3/3: 验证同步结果"
          echo "同步完成，验证 CNB 仓库内容..."
          
          # 临时克隆 CNB 仓库验证
          cd /tmp
          rm -rf verify-cnb
          git clone https://cnb:4nHxx367eG2LITgILI8xl6NuZEB@cnb.cool/tianli1680/ces.git verify-cnb 2>&1 | head -5
          
          if [ -d "verify-cnb/.git" ]; then
            echo "✓ CNB 仓库验证成功"
            echo "CNB 仓库文件数量: $(find verify-cnb -type f -not -path './.git/*' | wc -l)"
            echo ""
            echo "CNB 仓库内容预览:"
            ls -la verify-cnb/ | head -20
          fi
          
          echo ""
          echo "========================================"
          echo "✓ 手动同步完成！"
          echo "同步时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"
        else
          echo "错误: 推送失败"
          exit 1
        fi

# 诊断配置 - 用于检查仓库状态
.diagnose: &diagnose
  docker:
    image: alpine/git:latest
  stages:
    - name: 诊断 CNB 仓库状态
      script: |
        echo "========================================"
        echo "诊断 CNB 仓库状态"
        echo "========================================"
        
        # 检查 CNB 仓库
        CNB_REPO_URL="https://cnb:4nHxx367eG2LITgILI8xl6NuZEB@cnb.cool/tianli1680/ces.git"
        
        echo "1. 测试 CNB 仓库连接..."
        git ls-remote $CNB_REPO_URL
        
        echo ""
        echo "2. 检查 CNB 仓库分支..."
        git ls-remote --heads $CNB_REPO_URL
        
        echo ""
        echo "3. 尝试克隆 CNB 仓库..."
        cd /tmp
        rm -rf test-cnb-clone
        git clone $CNB_REPO_URL test-cnb-clone 2>&1 | head -10
        
        if [ -d "test-cnb-clone/.git" ]; then
          echo "✓ CNB 仓库克隆成功"
          cd test-cnb-clone
          echo "仓库内容:"
          ls -la
          echo ""
          echo "文件数量: $(find . -type f -not -path './.git/*' | wc -l)"
        else
          echo "✗ CNB 仓库为空或无法访问"
        fi

# 主流程配置
main:
  # 定时任务：每4小时执行一次
  "crontab: 0 */1 * * *":
    - *github-sync
  
  # 手动触发方式
  push:
    - ifModify:
        - ".sync-manual"
        - "sync.sh"
        - "force-sync"
      stages:
        - name: 检测手动同步标志
          script: |
            echo "========================================"
            echo "检测到手动同步标志文件"
            echo "开始执行同步任务..."
            echo "========================================"
        - *manual-sync
  
  # 诊断模式 - 创建 .diagnose 文件触发
  push:
    - ifModify:
        - ".diagnose"
      stages:
        - *diagnose

# 开发环境配置
dev:
  vscode:
    - docker:
        image: alpine/git:latest
      services:
        - vscode
      stages:
        - name: 开发环境准备
          script: |
            apk add --no-cache bash vim tree
            
            echo "========================================"
            echo "开发环境已准备就绪"
            echo "========================================"
            echo ""
            echo "可用的诊断命令:"
            echo "  bash /srv/diagnose.sh  - 诊断仓库状态"
            echo "  bash /srv/sync.sh      - 手动执行同步"
            echo ""
            
            # 创建诊断脚本
            cat > /srv/diagnose.sh << 'EOF'
            #!/bin/bash
            echo "诊断 CNB 仓库..."
            git ls-remote https://cnb:4nHxx367eG2LITgILI8xl6NuZEB@cnb.cool/tianli1680/ces.git
            echo ""
            echo "尝试克隆 CNB 仓库..."
            cd /tmp
            rm -rf cnb-check
            git clone https://cnb:4nHxx367eG2LITgILI8xl6NuZEB@cnb.cool/tianli1680/ces.git cnb-check
            if [ -d "cnb-check/.git" ]; then
              echo "✓ CNB 仓库可访问"
              ls -la cnb-check/
            else
              echo "✗ CNB 仓库为空"
            fi
            EOF
            
            # 创建同步脚本
            cat > /srv/sync.sh << 'EOF'
            #!/bin/bash
            cd /tmp
            rm -rf github-sync
            git clone https://github.com/tianli1680/kulaoTV.git github-sync
            cd github-sync
            git remote add cnb https://cnb:4nHxx367eG2LITgILI8xl6NuZEB@cnb.cool/tianli1680/ces.git
            git push cnb HEAD:main --force
            echo "同步完成！"
            EOF
            
            chmod +x /srv/diagnose.sh /srv/sync.sh
            
            echo "✓ 工具脚本已创建"
            echo ""
            echo "现在可以运行: bash /srv/diagnose.sh 来诊断问题"
