name: 提取并处理M3U频道

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extract-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4.2.2
      
    - name: 下载M3U文件
      run: |
        echo "正在下载M3U文件..."
        curl -L -o source.m3u "https://raw.githubusercontent.com/Jsnzkpg/Jsnzkpg/Jsnzkpg/Jsnzkpg1.m3u"
        
        if [ ! -f source.m3u ]; then
          echo "错误：文件下载失败"
          exit 1
        fi
        
        echo "文件下载成功，大小：$(wc -c < source.m3u) 字节"
        
    - name: 提取并处理频道
      run: |
        echo "正在提取指定分类频道..."
        
        # 创建临时文件来存储所有提取的频道
        > all_channels.txt
        
        # 定义需要匹配的模式（使用grep直接匹配）
        patterns=(
          'group-title="🎞️电影直播"'
          'group-title="📺电视剧直播"'
          'group-title="💽纪录片直播"'
          'group-title="🎧音乐直播"'
          'group-title="🏀\[联通\]咪视界直播"'
          'group-title="🔥\[三网\]央卫视直播"'
          'group-title="🔥\[电信\]央卫视直播"'
          'group-title="🔥\[移动\]央卫视直播"'
          'group-title="🔥\[联通\]央卫视直播"'
          'tvg-name="凤凰中文"'
          'tvg-name="凤凰资讯"'
          'tvg-name="鳳凰中文"'
        )
        
        # 使用grep提取匹配的频道行及其URL行
        for pattern in "${patterns[@]}"; do
          echo "匹配模式: $pattern"
          # 使用grep -B1获取匹配行及其上一行（EXTINF行），-A1获取下一行（URL行）
          grep -B1 -A1 "$pattern" source.m3u | grep -v "^--$" >> all_channels.txt
        done
        
        # 去重（因为同一个频道可能匹配多个模式）
        sort all_channels.txt | uniq > unique_channels.txt
        
        echo "提取完成，共提取 $(grep -c "^#EXTINF" unique_channels.txt) 个频道"
        
    - name: 处理并排序频道
      run: |
        echo "正在处理并排序频道..."
        
        # 创建最终的M3U文件
        echo "#EXTM3U" > kulaoTV.m3u
        
        # 定义央卫视直播的排序顺序（原始格式）
        yangshi_order=(
          'group-title="🔥[联通]央卫视直播"'
          'group-title="🔥[电信]央卫视直播"'
          'group-title="🔥[三网]央卫视直播"'
          'group-title="🔥[移动]央卫视直播"'
        )
        
        # 定义对应的新group-title
        yangshi_new=(
          'group-title="[联通]央卫视直播"'
          'group-title="[电信]央卫视直播"'
          'group-title="[三网]央卫视直播"'
          'group-title="[移动]央卫视直播"'
        )
        
        # 先处理央卫视直播，按顺序添加
        echo "正在按顺序添加央卫视直播..."
        
        for i in "${!yangshi_order[@]}"; do
          original="${yangshi_order[$i]}"
          new="${yangshi_new[$i]}"
          
          echo "处理: $new"
          
          # 提取匹配的频道并替换group-title
          grep -B1 -A1 "$original" unique_channels.txt 2>/dev/null | grep -v "^--$" | while IFS= read -r line; do
            if [[ $line == \#EXTINF:* ]]; then
              # 替换group-title
              echo "${line/$original/$new}" >> kulaoTV.m3u
            elif [[ ! $line =~ ^#EXTM3U ]]; then
              # 直接输出URL行
              echo "$line" >> kulaoTV.m3u
            fi
          done
        done
        
        # 处理其他频道（包括原有分类和凤凰频道）
        echo "正在添加其他频道..."
        
        # 定义其他需要替换的group-title
        other_replacements=(
          'group-title="🎞️电影直播"|group-title="电影直播"'
          'group-title="📺电视剧直播"|group-title="电视剧直播"'
          'group-title="💽纪录片直播"|group-title="纪录片直播"'
          'group-title="🎧音乐直播"|group-title="音乐直播"'
          'group-title="🏀[联通]咪视界直播"|group-title="咪视界直播"'
        )
        
        # 创建一个临时文件来存储非央卫视直播的频道
        grep -v -E 'group-title="🔥\[(联通|电信|三网|移动)\]央卫视直播"' unique_channels.txt > other_channels.txt
        
        # 处理其他频道
        while IFS= read -r line; do
          if [[ $line == \#EXTINF:* ]]; then
            modified_line="$line"
            # 应用所有替换
            for rep in "${other_replacements[@]}"; do
              old="${rep%|*}"
              new="${rep#*|}"
              modified_line="${modified_line//$old/$new}"
            done
            echo "$modified_line" >> kulaoTV.m3u
          elif [[ ! $line =~ ^#EXTM3U ]]; then
            echo "$line" >> kulaoTV.m3u
          fi
        done < other_channels.txt
        
        # 清理临时文件
        rm -f all_channels.txt unique_channels.txt other_channels.txt
        
        # 统计结果
        total=$(grep -c "^#EXTINF" kulaoTV.m3u || echo 0)
        echo "处理完成！最终文件共有 $total 个频道"
        
    - name: 显示结果统计
      run: |
        echo "📊 最终提取结果统计："
        echo "----------------------------------------"
        echo "文件：kulaoTV.m3u"
        echo "大小：$(wc -c < kulaoTV.m3u) 字节"
        echo "频道总数：$(grep -c "^#EXTINF" kulaoTV.m3u || echo 0)"
        echo ""
        
        echo "央卫视直播（按指定顺序）："
        yangshi_count=0
        for group in "[联通]央卫视直播" "[电信]央卫视直播" "[三网]央卫视直播" "[移动]央卫视直播"; do
          count=$(grep -c "group-title=\"$group\"" kulaoTV.m3u || echo 0)
          printf "  %-20s: %3d\n" "$group" $count
          yangshi_count=$((yangshi_count + count))
        done
        echo "  央卫视直播合计: $yangshi_count"
        echo ""
        
        echo "其他分类："
        grep "group-title=" kulaoTV.m3u | grep -v -E 'group-title="\[(联通|电信|三网|移动)\]央卫视直播"' | grep -o 'group-title="[^"]*"' | sort | uniq -c | sort -rn || echo "  无其他分类"
        echo ""
        
        echo "凤凰系列频道："
        grep -E 'tvg-name="(凤凰中文|凤凰资讯|鳳凰中文)"' kulaoTV.m3u 2>/dev/null | sed 's/.*tvg-name="\([^"]*\)".*/\1/' | sort | uniq -c || echo "  无凤凰频道"
        echo "----------------------------------------"
        
        # 显示前20行预览
        echo "文件前20行预览："
        head -n 20 kulaoTV.m3u
        
    - name: 检查文件有效性
      run: |
        if [ ! -s kulaoTV.m3u ]; then
          echo "❌ 错误：生成的kulaoTV.m3u文件为空"
          exit 1
        fi
        
        channel_count=$(grep -c "^#EXTINF" kulaoTV.m3u || echo 0)
        if [ $channel_count -eq 0 ]; then
          echo "❌ 错误：文件中没有找到任何频道"
          exit 1
        fi
        
        echo "✅ 文件检查通过，包含 $channel_count 个频道"
        
    - name: 提交更改
      run: |
        if [ -f kulaoTV.m3u ] && [ -s kulaoTV.m3u ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add kulaoTV.m3u
          
          if git diff --cached --quiet; then
            echo "文件无变化，无需提交"
          else
            git commit -m "更新kulaoTV.m3u文件 - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 已提交更新到仓库"
          fi
        else
          echo "⚠️ 警告：kulaoTV.m3u文件不存在或为空，跳过提交"
        fi
