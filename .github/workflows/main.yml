name: 提取并处理M3U频道

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extract-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4.2.2
      
    - name: 下载M3U文件
      run: |
        echo "正在下载M3U文件..."
        curl -L -o source.m3u "https://raw.githubusercontent.com/Jsnzkpg/Jsnzkpg/Jsnzkpg/Jsnzkpg1.m3u"
        
        if [ ! -f source.m3u ]; then
          echo "错误：文件下载失败"
          exit 1
        fi
        
        echo "文件下载成功，大小：$(wc -c < source.m3u) 字节"
        
    - name: 提取并处理频道
      run: |
        echo "正在提取指定分类频道..."
        
        # 创建临时文件
        > temp_all.m3u
        
        # 定义需要保留的group-title（原有分类）
        group_patterns=(
          "🎞️电影直播"
          "📺电视剧直播"
          "💽纪录片直播"
          "🎧音乐直播"
          "🏀[联通]咪视界直播"
        )
        
        # 定义新增的央卫视直播group-title
        yangshi_patterns=(
          "🔥[三网]央卫视直播"
          "🔥[电信]央卫视直播"
          "🔥[移动]央卫视直播"
          "🔥[联通]央卫视直播"
        )
        
        # 定义需要保留的tvg-name
        tvg_patterns=(
          "凤凰中文"
          "凤凰资讯"
          "鳳凰中文"
        )
        
        # 使用awk处理文件
        awk -v group_patterns="${group_patterns[*]}" -v yangshi_patterns="${yangshi_patterns[*]}" -v tvg_patterns="${tvg_patterns[*]}" '
        BEGIN {
          split(group_patterns, group_array, " ")
          split(yangshi_patterns, yangshi_array, " ")
          split(tvg_patterns, tvg_array, " ")
          channel_count = 0
        }
        
        /^#EXTINF:/ {
          current_line = $0
          matched = 0
          
          for (i in group_array) {
            if (index(current_line, "group-title=\"" group_array[i] "\"")) {
              matched = 1
              break
            }
          }
          
          if (!matched) {
            for (i in yangshi_array) {
              if (index(current_line, "group-title=\"" yangshi_array[i] "\"")) {
                matched = 1
                break
              }
            }
          }
          
          if (!matched) {
            for (i in tvg_array) {
              if (index(current_line, "tvg-name=\"" tvg_array[i] "\"")) {
                matched = 1
                break
              }
            }
          }
          
          if (matched) {
            gsub(/group-title="🎞️电影直播"/, "group-title=\"电影直播\"", current_line)
            gsub(/group-title="📺电视剧直播"/, "group-title=\"电视剧直播\"", current_line)
            gsub(/group-title="💽纪录片直播"/, "group-title=\"纪录片直播\"", current_line)
            gsub(/group-title="🎧音乐直播"/, "group-title=\"音乐直播\"", current_line)
            gsub(/group-title="🏀\[联通\]咪视界直播"/, "group-title=\"咪视界直播\"", current_line)
            
            gsub(/group-title="🔥\[三网\]央卫视直播"/, "group-title=\"[三网]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[电信\]央卫视直播"/, "group-title=\"[电信]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[移动\]央卫视直播"/, "group-title=\"[移动]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[联通\]央卫视直播"/, "group-title=\"[联通]央卫视直播\"", current_line)
            
            print current_line
            getline url_line
            print url_line
            channel_count++
          }
        }
        
        END {
          print "提取完成，共 " channel_count " 个频道" > "/dev/stderr"
        }
        ' source.m3u > temp_all.m3u
        
        echo "临时文件生成完成"
        echo "临时文件中的频道数量：$(grep -c "^#EXTINF" temp_all.m3u)"
        
    - name: 按指定顺序排序频道
      run: |
        echo "正在按指定顺序排序频道..."
        
        # 创建最终的M3U文件
        echo "#EXTM3U" > kulaoTV.m3u
        
        # 定义排序顺序（按照要求的顺序）- 注意这里要使用处理后的group-title名称
        order=(
          "[联通]央卫视直播"
          "[电信]央卫视直播" 
          "[三网]央卫视直播"
          "[移动]央卫视直播"
        )
        
        # 方法1：使用awk直接按指定顺序提取
        echo "方法1：使用awk按指定顺序提取央卫视直播..."
        
        # 为每个group创建单独的文件，然后按顺序合并
        for i in "${!order[@]}"; do
          group="${order[$i]}"
          echo "正在提取第 $((i+1)) 组: $group"
          
          # 提取匹配的频道（包括EXTINF行和下一行的URL）
          awk -v group="$group" '
          BEGIN { found=0 }
          {
            if ($0 ~ "group-title=\"" group "\"") {
              print $0  # 打印EXTINF行
              getline url_line  # 获取下一行
              print url_line
              found++
            }
          }
          END {
            if (found > 0) {
              print "找到 " found " 个 " group " 频道" > "/dev/stderr"
            }
          }' temp_all.m3u >> "temp_group_$i.m3u"
        done
        
        # 按顺序合并所有group文件
        echo "按顺序合并央卫视直播..."
        for i in "${!order[@]}"; do
          if [ -f "temp_group_$i.m3u" ] && [ -s "temp_group_$i.m3u" ]; then
            cat "temp_group_$i.m3u" >> kulaoTV.m3u
            rm "temp_group_$i.m3u"
          fi
        done
        
        # 方法2：提取所有非央卫视直播的频道
        echo "正在提取其他频道..."
        
        # 创建一个awk脚本来提取不在任何央卫视分类中的频道
        awk '
        function isYangshi(line) {
          return (line ~ /group-title="\[联通\]央卫视直播"/ || 
                  line ~ /group-title="\[电信\]央卫视直播"/ || 
                  line ~ /group-title="\[三网\]央卫视直播"/ || 
                  line ~ /group-title="\[移动\]央卫视直播"/)
        }
        
        BEGIN { skip_next = 0 }
        {
          if (skip_next) {
            skip_next = 0
            next
          }
          
          if ($0 ~ /^#EXTINF:/) {
            if (isYangshi($0)) {
              # 如果是央卫视直播，跳过这一行和下一行
              skip_next = 1
            } else {
              # 如果不是央卫视直播，打印这一行
              print $0
              getline url_line
              print url_line
            }
          }
        }' temp_all.m3u >> kulaoTV.m3u
        
        # 统计结果
        echo ""
        echo "排序完成！最终文件统计："
        echo "----------------------------------------"
        
        total=$(grep -c "^#EXTINF" kulaoTV.m3u || echo 0)
        echo "总频道数: $total"
        
        echo ""
        echo "按顺序验证央卫视直播："
        for group in "${order[@]}"; do
          count=$(grep -c "group-title=\"$group\"" kulaoTV.m3u || echo 0)
          echo "  $group: $count"
          
          # 显示前几个频道的名称作为验证
          if [ $count -gt 0 ]; then
            echo "    示例频道:"
            grep -B1 "group-title=\"$group\"" kulaoTV.m3u | grep "^#EXTINF" | head -3 | sed 's/.*,//' | sed 's/^/      /'
          fi
        done
        
    - name: 显示结果统计
      run: |
        echo "📊 提取结果统计："
        echo "----------------------------------------"
        echo "文件：kulaoTV.m3u"
        echo "大小：$(wc -c < kulaoTV.m3u) 字节"
        echo "频道总数：$(grep -c "^#EXTINF" kulaoTV.m3u || echo 0)"
        echo ""
        echo "按指定顺序的央卫视直播："
        order=("[联通]央卫视直播" "[电信]央卫视直播" "[三网]央卫视直播" "[移动]央卫视直播")
        
        yangshi_total=0
        for group in "${order[@]}"; do
          count=$(grep -c "group-title=\"$group\"" kulaoTV.m3u || echo 0)
          printf "  %-20s: %3d\n" "$group" $count
          yangshi_total=$((yangshi_total + count))
        done
        echo "  央卫视直播合计: $yangshi_total"
        echo ""
        
        echo "其他分类："
        grep "group-title=" kulaoTV.m3u 2>/dev/null | grep -v -E 'group-title="\[(联通|电信|三网|移动)\]央卫视直播"' | grep -o 'group-title="[^"]*"' | sort | uniq -c | sort -rn || echo "  无其他分类"
        echo ""
        
        echo "凤凰系列频道："
        grep -E 'tvg-name="(凤凰中文|凤凰资讯|鳳凰中文)"' kulaoTV.m3u 2>/dev/null | sed 's/.*tvg-name="\([^"]*\)".*/\1/' | sort | uniq -c || echo "  无凤凰频道"
        echo "----------------------------------------"
        
    - name: 检查文件有效性
      run: |
        if [ ! -s kulaoTV.m3u ]; then
          echo "❌ 错误：生成的kulaoTV.m3u文件为空"
          exit 1
        fi
        
        if [ $(grep -c "^#EXTINF" kulaoTV.m3u 2>/dev/null || echo 0) -eq 0 ]; then
          echo "❌ 错误：文件中没有找到任何频道"
          exit 1
        fi
        
        # 验证排序顺序
        echo "验证排序顺序..."
        
        # 获取文件中出现的所有央卫视直播group-title（按出现顺序）
        echo "文件中央卫视直播出现顺序："
        grep "group-title=" kulaoTV.m3u | grep -E 'group-title="\[(联通|电信|三网|移动)\]央卫视直播"' | head -10 | sed 's/.*group-title="\([^"]*\)".*/\1/' | uniq -c
        
        echo "✅ 文件检查通过"
        
    - name: 提交更改
      run: |
        if [ -f kulaoTV.m3u ] && [ -s kulaoTV.m3u ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add kulaoTV.m3u
          
          if git diff --cached --quiet; then
            echo "文件无变化，无需提交"
          else
            git commit -m "更新kulaoTV.m3u文件 - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 已提交更新到仓库"
          fi
        else
          echo "⚠️ 警告：kulaoTV.m3u文件不存在或为空，跳过提交"
        fi
