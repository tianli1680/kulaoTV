name: 提取并处理M3U频道

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extract-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4.2.2
      
    - name: 下载M3U文件
      run: |
        echo "正在下载M3U文件..."
        curl -L -o source.m3u "https://raw.githubusercontent.com/Jsnzkpg/Jsnzkpg/Jsnzkpg/Jsnzkpg1.m3u"
        
        if [ ! -f source.m3u ]; then
          echo "错误：文件下载失败"
          exit 1
        fi
        
        echo "文件下载成功，大小：$(wc -c < source.m3u) 字节"
        
    - name: 提取并处理频道
      run: |
        echo "正在提取指定分类频道..."
        
        # 创建临时文件
        > temp_all.m3u
        
        # 定义需要保留的group-title（原有分类）
        group_patterns=(
          "🎞️电影直播"
          "📺电视剧直播"
          "💽纪录片直播"
          "🎧音乐直播"
          "🏀[联通]咪视界直播"
        )
        
        # 定义新增的央卫视直播group-title
        yangshi_patterns=(
          "🔥[三网]央卫视直播"
          "🔥[电信]央卫视直播"
          "🔥[移动]央卫视直播"
          "🔥[联通]央卫视直播"
        )
        
        # 定义需要保留的tvg-name
        tvg_patterns=(
          "凤凰中文"
          "凤凰资讯"
          "鳳凰中文"
        )
        
        # 使用awk处理文件
        awk -v group_patterns="${group_patterns[*]}" -v yangshi_patterns="${yangshi_patterns[*]}" -v tvg_patterns="${tvg_patterns[*]}" '
        BEGIN {
          split(group_patterns, group_array, " ")
          split(yangshi_patterns, yangshi_array, " ")
          split(tvg_patterns, tvg_array, " ")
          channel_count = 0
        }
        
        /^#EXTINF:/ {
          current_line = $0
          matched = 0
          
          for (i in group_array) {
            if (index(current_line, "group-title=\"" group_array[i] "\"")) {
              matched = 1
              break
            }
          }
          
          if (!matched) {
            for (i in yangshi_array) {
              if (index(current_line, "group-title=\"" yangshi_array[i] "\"")) {
                matched = 1
                break
              }
            }
          }
          
          if (!matched) {
            for (i in tvg_array) {
              if (index(current_line, "tvg-name=\"" tvg_array[i] "\"")) {
                matched = 1
                break
              }
            }
          }
          
          if (matched) {
            gsub(/group-title="🎞️电影直播"/, "group-title=\"电影直播\"", current_line)
            gsub(/group-title="📺电视剧直播"/, "group-title=\"电视剧直播\"", current_line)
            gsub(/group-title="💽纪录片直播"/, "group-title=\"纪录片直播\"", current_line)
            gsub(/group-title="🎧音乐直播"/, "group-title=\"音乐直播\"", current_line)
            gsub(/group-title="🏀\[联通\]咪视界直播"/, "group-title=\"咪视界直播\"", current_line)
            
            gsub(/group-title="🔥\[三网\]央卫视直播"/, "group-title=\"[三网]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[电信\]央卫视直播"/, "group-title=\"[电信]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[移动\]央卫视直播"/, "group-title=\"[移动]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[联通\]央卫视直播"/, "group-title=\"[联通]央卫视直播\"", current_line)
            
            print current_line
            getline url_line
            print url_line
            channel_count++
          }
        }
        
        END {
          print "提取完成，共 " channel_count " 个频道" > "/dev/stderr"
        }
        ' source.m3u > temp_all.m3u
        
        echo "临时文件生成完成"
        echo "临时文件中的频道数量：$(grep -c "^#EXTINF" temp_all.m3u)"
        
    - name: 按指定顺序排序频道
      run: |
        echo "正在按指定顺序排序频道..."
        
        # 创建最终的M3U文件
        echo "#EXTM3U" > kulaoTV.m3u
        
        # 定义排序顺序（按照要求的顺序）
        order=(
          "[联通]央卫视直播"
          "[电信]央卫视直播" 
          "[三网]央卫视直播"
          "[移动]央卫视直播"
        )
        
        # 创建临时文件来存储已处理的频道ID，避免重复
        > processed.txt
        
        # 先添加指定顺序的央卫视直播
        for group in "${order[@]}"; do
          echo "正在添加 $group 频道..."
          
          # 使用awk提取匹配的频道，确保不重复
          awk -v group="$group" -v processed="processed.txt" '
          BEGIN {
            # 读取已处理的行号
            while ((getline line < processed) > 0) {
              processed_lines[line] = 1
            }
            close(processed)
          }
          {
            if ($0 ~ "group-title=\"" group "\"") {
              # 如果这一行是EXTINF行且未被处理过
              if (!(NR in processed_lines)) {
                print $0  # 打印EXTINF行
                getline url_line  # 获取下一行（URL）
                print url_line
                # 记录这两行的行号
                print NR > processed
                print NR+1 > processed
              }
            }
          }' temp_all.m3u >> kulaoTV.m3u
        done
        
        # 再添加其他所有频道（非央卫视直播和未被处理的）
        echo "正在添加其他频道..."
        
        awk -v processed="processed.txt" '
        BEGIN {
          # 读取已处理的行号
          while ((getline line < processed) > 0) {
            processed_lines[line] = 1
          }
          close(processed)
        }
        {
          # 如果这一行未被处理过，则输出
          if (!(NR in processed_lines)) {
            print $0
          }
        }' temp_all.m3u >> kulaoTV.m3u
        
        # 清理临时文件
        rm -f processed.txt
        
        # 统计总数
        total=$(grep -c "^#EXTINF" kulaoTV.m3u || echo 0)
        echo "排序完成！最终文件共有 $total 个频道"
        
        # 验证央卫视直播是否还在
        echo "验证央卫视直播数量："
        for group in "${order[@]}"; do
          count=$(grep -c "group-title=\"$group\"" kulaoTV.m3u || echo 0)
          echo "  $group: $count"
        done
        
    - name: 显示结果统计
      run: |
        echo "📊 提取结果统计："
        echo "----------------------------------------"
        echo "文件：kulaoTV.m3u"
        echo "大小：$(wc -c < kulaoTV.m3u) 字节"
        echo "频道总数：$(grep -c "^#EXTINF" kulaoTV.m3u || echo 0)"
        echo ""
        echo "各分类频道数量："
        echo "央卫视直播分类："
        for group in "[联通]央卫视直播" "[电信]央卫视直播" "[三网]央卫视直播" "[移动]央卫视直播"; do
          count=$(grep -c "group-title=\"$group\"" kulaoTV.m3u || echo 0)
          echo "  $group: $count"
        done
        echo ""
        echo "其他分类："
        grep "group-title=" kulaoTV.m3u 2>/dev/null | grep -v -E 'group-title="\[(联通|电信|三网|移动)\]央卫视直播"' | grep -o 'group-title="[^"]*"' | sort | uniq -c || echo "  无其他分类"
        echo ""
        echo "凤凰系列频道："
        grep -E 'tvg-name="(凤凰中文|凤凰资讯|鳳凰中文)"' kulaoTV.m3u 2>/dev/null | sed 's/.*tvg-name="\([^"]*\)".*/\1/' | sort | uniq -c || echo "  无凤凰频道"
        echo "----------------------------------------"
        
    - name: 检查文件有效性
      run: |
        if [ ! -s kulaoTV.m3u ]; then
          echo "❌ 错误：生成的kulaoTV.m3u文件为空"
          exit 1
        fi
        
        if [ $(grep -c "^#EXTINF" kulaoTV.m3u 2>/dev/null || echo 0) -eq 0 ]; then
          echo "❌ 错误：文件中没有找到任何频道"
          exit 1
        fi
        
        # 特别检查央卫视直播是否还在
        yangshi_total=$(grep -c -E 'group-title="\[(联通|电信|三网|移动)\]央卫视直播"' kulaoTV.m3u || echo 0)
        if [ $yangshi_total -eq 0 ]; then
          echo "⚠️ 警告：文件中没有找到央卫视直播频道"
        else
          echo "✅ 找到 $yangshi_total 个央卫视直播频道"
        fi
        
        echo "✅ 文件检查通过"
        
    - name: 提交更改
      run: |
        if [ -f kulaoTV.m3u ] && [ -s kulaoTV.m3u ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add kulaoTV.m3u
          
          if git diff --cached --quiet; then
            echo "文件无变化，无需提交"
          else
            git commit -m "更新kulaoTV.m3u文件 - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 已提交更新到仓库"
          fi
        else
          echo "⚠️ 警告：kulaoTV.m3u文件不存在或为空，跳过提交"
        fi
        
    - name: 提取凤凰频道到单独文件（可选）
      run: |
        echo "#EXTM3U" > fenghuang_channels.m3u
        grep -B1 -E 'tvg-name="(凤凰中文|凤凰资讯|鳳凰中文)"' kulaoTV.m3u 2>/dev/null | grep -v "^--$" >> fenghuang_channels.m3u || true
        
        if [ -s fenghuang_channels.m3u ] && [ $(grep -c "^#EXTINF" fenghuang_channels.m3u 2>/dev/null || echo 0) -gt 0 ]; then
          echo "✅ 已提取凤凰频道到 fenghuang_channels.m3u"
          echo "凤凰频道数量：$(grep -c "^#EXTINF" fenghuang_channels.m3u)"
          git add fenghuang_channels.m3u 2>/dev/null || true
        else
          echo "未找到凤凰系列频道"
          rm -f fenghuang_channels.m3u
        fi
