name: 提取并处理M3U频道

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 强制使用Node.js 24

jobs:
  extract-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4.2.2  # 使用最新版本
      
    - name: 下载M3U文件
      run: |
        echo "正在下载M3U文件..."
        curl -L -o source.m3u "https://raw.githubusercontent.com/Jsnzkpg/Jsnzkpg/Jsnzkpg/Jsnzkpg1.m3u"
        
        # 检查文件是否下载成功
        if [ ! -f source.m3u ]; then
          echo "错误：文件下载失败"
          exit 1
        fi
        
        echo "文件下载成功，大小：$(wc -c < source.m3u) 字节"
        
    - name: 提取并处理频道
      run: |
        echo "正在提取指定分类频道..."
        
        # 创建新的M3U文件
        echo "#EXTM3U" > kulaoTV.m3u
        
        # 定义需要保留的group-title（原有分类）
        group_patterns=(
          "🎞️电影直播"
          "📺电视剧直播"
          "💽纪录片直播"
          "🎧音乐直播"
          "🏀[联通]咪视界直播"
        )
        
        # 定义新增的央卫视直播group-title
        yangshi_patterns=(
          "🔥[三网]央卫视直播"
          "🔥[电信]央卫视直播"
          "🔥[移动]央卫视直播"
          "🔥[联通]央卫视直播"
        )
        
        # 定义需要保留的tvg-name
        tvg_patterns=(
          "凤凰中文"
          "凤凰资讯"
          "鳳凰中文"
        )
        
        # 使用awk处理文件
        awk -v group_patterns="${group_patterns[*]}" -v yangshi_patterns="${yangshi_patterns[*]}" -v tvg_patterns="${tvg_patterns[*]}" '
        BEGIN {
          # 分割原有group-title模式
          split(group_patterns, group_array, " ")
          # 分割央卫视group-title模式
          split(yangshi_patterns, yangshi_array, " ")
          # 分割tvg-name模式
          split(tvg_patterns, tvg_array, " ")
          channel_count = 0
        }
        
        /^#EXTINF:/ {
          # 保存当前行
          current_line = $0
          matched = 0
          
          # 检查是否匹配任何原有group-title模式
          for (i in group_array) {
            if (index(current_line, "group-title=\"" group_array[i] "\"")) {
              matched = 1
              break
            }
          }
          
          # 如果没匹配到原有group-title，检查是否匹配央卫视group-title模式
          if (!matched) {
            for (i in yangshi_array) {
              if (index(current_line, "group-title=\"" yangshi_array[i] "\"")) {
                matched = 1
                break
              }
            }
          }
          
          # 如果没匹配到任何group-title，检查是否匹配tvg-name模式
          if (!matched) {
            for (i in tvg_array) {
              if (index(current_line, "tvg-name=\"" tvg_array[i] "\"")) {
                matched = 1
                break
              }
            }
          }
          
          if (matched) {
            # 进行原有group-title替换
            gsub(/group-title="🎞️电影直播"/, "group-title=\"电影直播\"", current_line)
            gsub(/group-title="📺电视剧直播"/, "group-title=\"电视剧直播\"", current_line)
            gsub(/group-title="💽纪录片直播"/, "group-title=\"纪录片直播\"", current_line)
            gsub(/group-title="🎧音乐直播"/, "group-title=\"音乐直播\"", current_line)
            gsub(/group-title="🏀\[联通\]咪视界直播"/, "group-title=\"咪视界直播\"", current_line)
            
            # 进行央卫视group-title替换（移除🔥符号）
            gsub(/group-title="🔥\[三网\]央卫视直播"/, "group-title=\"[三网]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[电信\]央卫视直播"/, "group-title=\"[电信]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[移动\]央卫视直播"/, "group-title=\"[移动]央卫视直播\"", current_line)
            gsub(/group-title="🔥\[联通\]央卫视直播"/, "group-title=\"[联通]央卫视直播\"", current_line)
            
            # 保存处理后的行
            print current_line
            getline url_line
            print url_line
            channel_count++
          }
        }
        
        END {
          print "提取完成，共 " channel_count " 个频道" > "/dev/stderr"
        }
        ' source.m3u >> kulaoTV.m3u
        
        # 检查结果
        channel_count=$(grep -c "^#EXTINF" kulaoTV.m3u)
        echo "处理完成！共提取 ${channel_count} 个频道"
        
    - name: 显示结果统计
      run: |
        echo "📊 提取结果统计："
        echo "----------------------------------------"
        echo "文件：kulaoTV.m3u"
        echo "大小：$(wc -c < kulaoTV.m3u) 字节"
        echo "频道总数：$(grep -c "^#EXTINF" kulaoTV.m3u)"
        echo ""
        echo "各分类频道数量："
        grep "group-title=" kulaoTV.m3u | grep -o 'group-title="[^"]*"' | sort | uniq -c
        echo ""
        echo "央卫视直播分类统计："
        grep -E 'group-title="\[(三网|电信|移动|联通)\]央卫视直播"' kulaoTV.m3u | grep -o 'group-title="[^"]*"' | sort | uniq -c
        echo ""
        echo "凤凰系列频道："
        grep -E 'tvg-name="(凤凰中文|凤凰资讯|鳳凰中文)"' kulaoTV.m3u | sed 's/.*tvg-name="\([^"]*\)".*/\1/' | sort | uniq -c
        echo "----------------------------------------"
        
    - name: 检查文件有效性
      run: |
        if [ ! -s kulaoTV.m3u ]; then
          echo "❌ 错误：生成的kulaoTV.m3u文件为空"
          exit 1
        fi
        
        if [ $(grep -c "^#EXTINF" kulaoTV.m3u) -eq 0 ]; then
          echo "❌ 错误：文件中没有找到任何频道"
          exit 1
        fi
        
        echo "✅ 文件检查通过"
        
    - name: 提交更改
      run: |
        # 检查文件是否有变化
        if [ -f kulaoTV.m3u ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add kulaoTV.m3u
          
          # 检查是否有改动需要提交
          if git diff --cached --quiet; then
            echo "文件无变化，无需提交"
          else
            git commit -m "更新kulaoTV.m3u文件 - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 已提交更新到仓库"
          fi
        else
          echo "❌ 错误：kulaoTV.m3u文件不存在"
          exit 1
        fi
        
    - name: 提取凤凰频道到单独文件（可选）
      run: |
        echo "#EXTM3U" > fenghuang_channels.m3u
        grep -B1 -E 'tvg-name="(凤凰中文|凤凰资讯|鳳凰中文)"' kulaoTV.m3u | grep -v "^--$" >> fenghuang_channels.m3u
        
        if [ -s fenghuang_channels.m3u ] && [ $(grep -c "^#EXTINF" fenghuang_channels.m3u) -gt 0 ]; then
          echo "✅ 已提取凤凰频道到 fenghuang_channels.m3u"
          echo "凤凰频道数量：$(grep -c "^#EXTINF" fenghuang_channels.m3u)"
          
          # 可选：也提交凤凰频道的单独文件
          git add fenghuang_channels.m3u
        else
          echo "未找到凤凰系列频道"
          rm -f fenghuang_channels.m3u
        fi
