name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Download and process M3U
        run: |
          python process_m3u.py
      
      - name: Add update date to M3U file
        run: |
          # 获取当前日期并添加到文件开头
          CURRENT_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          # 创建临时文件，添加更新日期注释
          echo "# 更新日期: $CURRENT_DATE" > temp.m3u
          echo "" >> temp.m3u
          # 将原文件内容追加到临时文件
          cat kulaoTV.m3u >> temp.m3u
          # 替换原文件
          mv temp.m3u kulaoTV.m3u
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kulaoTV.m3u
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update M3U playlist - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
